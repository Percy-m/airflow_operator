[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-provider-aidatalake"
version = "0.1.0"
description = "Airflow 3 provider for AiDatalake Spark and Ray jobs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apache-airflow>=3.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "requests-mock>=1.11.0",
]

[project.entry-points.apache_airflow_provider]
token_provider_info = "custom_operator.token.provider_info:get_provider_info"
spark_provider_info = "custom_operator.spark.provider_info:get_provider_info"
ray_provider_info = "custom_operator.ray.provider_info:get_provider_info"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
